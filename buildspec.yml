
version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "lawrence-test"

phases:
  pre_build:
    commands:
      - echo "Preparing ECR login..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - IMAGE_TAG=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest} | cut -c 1-12)
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${REGISTRY_URI}

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t ${IMAGE_REPO_NAME}:${IMAGE_TAG} .
      - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} ${REGISTRY_URI}/${IMAGE_REPO_NAME}:${IMAGE_TAG}

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - docker push ${REGISTRY_URI}/${IMAGE_REPO_NAME}:${IMAGE_TAG}
      - echo "Image pushed successfully."
      - echo "IMAGE_URI=${REGISTRY_URI}/${IMAGE_REPO_NAME}:${IMAGE_TAG}"
